<style>
        .neo-raised {
            box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
        }
        .neo-pressed {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
        }
        .neo-button:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
            transform: scale(0.98);
        }
    </style>

<body class="bg-background text-on-surface font-body h-full flex flex-col antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface no-border shadow-[6px_6px_12px_rgba(0,0,0,0.08),-6px_-6px_12px_rgba(255,255,255,0.6)] z-40">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<span class="text-xl font-semibold text-primary dark:text-primary-fixed-dim">GuessMaster</span>
</div>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-6 gap-10 max-w-2xl mx-auto w-full pb-32">
<!-- Scoreboard -->
<div class="flex gap-6 w-full justify-center">
<div class="bg-surface rounded-xl neo-raised px-6 py-3 flex flex-col items-center">
<span class="text-sm font-medium text-on-surface-variant uppercase tracking-wider">Wins</span>
<span id="wins"class="text-2xl font-semibold text-primary">0</span>
</div>
<div class="bg-surface rounded-xl neo-raised px-6 py-3 flex flex-col items-center">
<span class="text-sm font-medium text-on-surface-variant uppercase tracking-wider">Losses</span>
<span id="loses" class="text-2xl font-semibold text-tertiary">0</span>
</div>
</div>
<!-- Game Status -->
<div class="text-center">
<h2 class="text-xl font-medium text-on-surface">Choose your weapon!</h2>
</div>
<!-- Central Arena -->
<div class="bg-surface rounded-[2rem] neo-raised w-full p-8 flex justify-between items-center relative">
<div class="flex flex-col items-center gap-4 z-10">
<span class="text-sm font-semibold text-primary tracking-wide">YOU</span>
<div class="w-24 h-24 rounded-full bg-surface neo-raised flex items-center justify-center text-primary">
<span id="player" class="text-5xl font-sans">?</span>
</div>
</div>
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl font-bold text-on-surface-variant opacity-50 z-0">
                VS
            </div>
<div class="flex flex-col items-center gap-4 z-10">
<span class="text-sm font-semibold text-tertiary tracking-wide">OPPONENT</span>
<div class="w-24 h-24 rounded-full bg-surface neo-raised flex items-center justify-center text-tertiary">
<span id="opponent" class="text-5xl font-sans">?</span>
</div>
</div>
</div>
<!-- Controls Section -->
<div class="flex gap-8 justify-center mt-4 ">
<button id="paper" class="bg-surface hover:bg-primary  hover:text-white w-24 h-24 rounded-full neo-raised neo-button flex flex-col items-center justify-center gap-2 text-primary transition-all duration-200">
<span class="material-symbols-outlined text-3xl" data-icon="back_hand">back_hand</span> <!-- Paper approx -->
<span class="text-xs font-semibold">Paper</span>
</button>
<button id="rock" class="bg-surface hover:bg-primary hover:text-white w-24 h-24 rounded-full neo-raised neo-button flex flex-col items-center justify-center gap-2 text-primary transition-all duration-200">
<span class="material-symbols-outlined text-4xl" data-icon="landscape">landscape</span> <!-- Rock approx -->
<span class="text-sm font-semibold">Rock</span>
</button>
<button id="scissors" class="bg-surface hover:bg-primary hover:text-white w-24 h-24 rounded-full neo-raised neo-button flex flex-col items-center justify-center gap-2 text-primary transition-all duration-200">
<span class="material-symbols-outlined text-3xl" data-icon="content_cut">content_cut</span>
<span class="text-xs font-semibold">Scissors</span>
</button>
</div>
</main>
<script src="script.js"></script>
